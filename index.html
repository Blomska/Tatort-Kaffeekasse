<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tatort-Kaffeekasse · Kripo Dülmen</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --surface-subtle: #faf9f6;
      --header-bg: #1c1917;
      --header-border: #292524;
      --ink: #1c1917;
      --ink-secondary: #57534e;
      --ink-muted: #78716c;
      --border: #e6e2da;
      --border-strong: #d6d0c4;
      --accent: #9a3412;
      --accent-hover: #7c2d12;
      --accent-soft: #ffedd5;
      --pos: #15803d;
      --pos-bg: #dcfce7;
      --neg: #b91c1c;
      --neg-bg: #fee2e2;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --radius: 12px;
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, 0.05);
      --shadow-md: 0 10px 28px rgba(28, 25, 23, 0.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.48;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 64px;
    }

    .num { font-variant-numeric: tabular-nums; }

    /* Header */
    header {
      background: var(--header-bg);
      color: #fafaf9;
      border-bottom: 1px solid var(--header-border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-inner {
      max-width: 1140px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #292524;
      border: 1px solid #44403c;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fdba74;
      flex-shrink: 0;
    }
    .brand h1 {
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.2;
    }
    .brand p {
      font-size: 0.78rem;
      color: #a8a29e;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      background: #292524;
      color: #d6d3d1;
      border: 1px solid #44403c;
      cursor: pointer;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #78716c;
    }
    .status-pill.live .status-dot { background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
    .status-pill.error .status-dot { background: #ef4444; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 14px;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
      font-family: inherit;
      white-space: nowrap;
    }
    .btn:active { transform: translateY(1px); }
    .btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-dark { background: var(--ink); color: #fff; }
    .btn-dark:hover { background: #292524; }

    .btn-surface {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }
    .btn-surface:hover { background: var(--surface-subtle); }

    .btn-toggle-on {
      background: var(--pos-bg);
      color: var(--pos);
      border-color: #bbf7d0;
    }
    .btn-toggle-on:hover { background: #bbf7d0; }

    .btn-header {
      background: #292524;
      color: #f5f5f4;
      border-color: #44403c;
    }
    .btn-header:hover { background: #3f3b38; }

    .btn-danger-soft {
      background: var(--neg-bg);
      color: var(--neg);
      border-color: #fecaca;
    }
    .btn-danger-soft:hover { background: #fecaca; }

    .btn-sm { padding: 6px 10px; font-size: 0.79rem; border-radius: 7px; }

    /* Layout */
    .container {
      max-width: 1140px;
      margin: 22px auto 0;
      padding: 0 18px;
    }

    /* KPI Strip */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 18px;
      box-shadow: var(--shadow-sm);
    }
    .kpi-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.76rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
    }
    .kpi-value {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 6px;
    }
    .kpi-sub {
      font-size: 0.78rem;
      color: var(--ink-secondary);
      margin-top: 3px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .toolbar-left, .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Main 2-Column Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-title {
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-body { padding: 16px 18px; }

    /* Member Rows */
    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s ease;
      gap: 12px;
    }
    .member-row:last-child { border-bottom: none; }
    .member-row:hover { background: var(--surface-subtle); }

    .member-main { display: flex; flex-direction: column; gap: 3px; }
    .member-name-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-weight: 650;
      font-size: 0.95rem;
    }
    .member-sub {
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.71rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .pill-ok { background: var(--pos-bg); color: var(--pos); }
    .pill-credit { background: #e0f2fe; color: #0369a1; }
    .pill-warn { background: var(--warn-bg); color: var(--warn); }
    .pill-muted { background: #ece8e1; color: var(--ink-secondary); }

    .member-right {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: right;
    }
    .balance-val {
      font-weight: 700;
      font-size: 1rem;
    }
    .c-pos { color: var(--pos); }
    .c-neg { color: var(--neg); }
    .c-neu { color: var(--ink); }

    /* Breakfast Chips */
    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 12px 0 16px;
    }
    .chip {
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      user-select: none;
      transition: all 0.12s ease;
    }
    .chip:hover { border-color: var(--ink-muted); }
    .chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #fff;
    }

    .breakfast-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    /* Transaction Ledger */
    .tx-row {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-title { font-size: 0.88rem; font-weight: 600; }
    .tx-meta { font-size: 0.77rem; color: var(--ink-muted); margin-top: 2px; }
    .tx-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .tx-amount { font-size: 0.9rem; font-weight: 700; }

    .undo-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
    }
    .undo-btn:hover {
      background: var(--neg-bg);
      color: var(--neg);
    }

    /* Select / Inputs */
    .select-sm {
      padding: 5px 9px;
      font-size: 0.78rem;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--ink);
    }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .form-control {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--ink);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(154, 52, 18, 0.12);
    }
    .hint { font-size: 0.76rem; color: var(--ink-muted); margin-top: 4px; }

    /* Modals */
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }
    .backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
    }
    .modal-head {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 2;
    }
    .modal-head h3 { font-size: 1rem; font-weight: 700; }
    .modal-body { padding: 18px 20px; }
    .modal-foot {
      padding: 13px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface-subtle);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .mono-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 9px 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      word-break: break-all;
      color: var(--ink);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--header-bg);
      color: #fafaf9;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      border: 1px solid #44403c;
      transform: translateY(120%);
      opacity: 0;
      transition: all 0.22s ease;
      z-index: 200;
      max-width: 90vw;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/>
        </svg>
      </div>
      <div>
        <h1>Tatort-Kaffeekasse</h1>
        <p>Kripo Dülmen · Frühstück, Einkäufe &amp; Barkasse</p>
      </div>
    </div>

    <div class="header-actions">
      <button id="adminLockBtn" class="btn btn-header btn-sm" style="display:none;" onclick="toggleAdminSession()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="1
